<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribble - AI Writing Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="navbar">

            <div class="logo">
                Scribble
            </div>

            <nav class="links">
                <a href="#">Features</a>
                <a href="#">Pricing</a>
                <a href="#">Testimonials</a>
                <a href="#">Blog</a>
            </nav>

            <div class="auth-buttons">
                <button class="login-btn">
                    Login
                </button>

                <button class="primary-btn">
                    Try for Free
                </button>
            </div>

        </header>


        <main>

            <section class="hero">

                <p class="badge">
                    Early access • Free Forever
                </p>

                <h1>
                    Write without the blank page. <br>
                    Scribble thinks with you.
                </h1>

                <p class="hero-description">
                    Your AI writing partner. Draft faster, write better.
                </p>

                <div class="hero-buttons">

                    <button class="primary-btn">
                        Start Writing Free
                    </button>

                    <button class="secondary-btn">
                        See how it works
                    </button>

                </div>

                <div class="trust-info">
                    <span>✔ No credit card required</span>
                    <span>✔ 14-day free trial</span>
                    <span>✔ Cancel anytime</span>
                </div>

                <div class="hero-preview">

                </div>

            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
